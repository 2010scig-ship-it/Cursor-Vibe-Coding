<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="뒤집힌 카드를 기억하고 같은 동물 친구를 찾는 기억력 짝 맞추기 게임"
    />
    <title>찰칵! 기억 사진관</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ef7b45'/%3E%3Cpath d='M32 13l4.6 13.4H51l-11.6 8.3 4.5 13.5L32 39.9l-11.9 8.3 4.5-13.5L13 26.4h14.4z' fill='%23fffdf7'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#" aria-label="찰칵! 기억 사진관 처음으로">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>
          <strong>찰칵!</strong>
          <small>기억 사진관</small>
        </span>
      </a>

      <button class="sound-button" id="soundButton" type="button" aria-pressed="true">
        <span class="sound-icon" aria-hidden="true">♪</span>
        <span>소리 켜짐</span>
      </button>
    </header>

    <main>
      <section class="hero" aria-labelledby="gameTitle">
        <div class="eyebrow"><span></span>오늘의 기억 훈련<span></span></div>
        <h1 id="gameTitle">사진 속 <em>동물 친구</em>를<br />짝지어 주세요!</h1>
        <p>카드를 뒤집어 같은 친구를 찾으면 성공이에요.</p>
      </section>

      <section class="game-shell" aria-label="기억력 짝 맞추기 게임">
        <div class="game-toolbar">
          <div class="difficulty-group" aria-label="난이도 선택">
            <span class="toolbar-label">난이도</span>
            <div class="segmented-control">
              <button type="button" data-level="easy">쉬움 <small>4×3</small></button>
              <button type="button" class="active" data-level="normal">보통 <small>4×4</small></button>
              <button type="button" data-level="hard">어려움 <small>6×4</small></button>
            </div>
          </div>

          <button class="new-game-button" id="newGameButton" type="button">
            <span aria-hidden="true">↻</span> 새 게임
          </button>
        </div>

        <div class="scoreboard" aria-label="게임 현황">
          <div class="score-item">
            <span class="score-icon moves-icon" aria-hidden="true">◆</span>
            <span>
              <small>이동 횟수</small>
              <strong><span id="moves">0</span><i> 회</i></strong>
            </span>
          </div>
          <div class="score-item">
            <span class="score-icon time-icon" aria-hidden="true">◷</span>
            <span>
              <small>경과 시간</small>
              <strong id="timer">00:00</strong>
            </span>
          </div>
          <div class="score-item">
            <span class="score-icon combo-icon" aria-hidden="true">✦</span>
            <span>
              <small>연속 성공</small>
              <strong><span id="combo">0</span><i> 콤보</i></strong>
            </span>
          </div>
        </div>

        <div class="progress-row">
          <span>찾은 친구</span>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="찾은 카드 짝"
            aria-valuemin="0"
            aria-valuenow="0"
          >
            <span id="progressBar"></span>
          </div>
          <strong><span id="matchedCount">0</span> / <span id="totalPairs">8</span></strong>
        </div>

        <div class="board-wrap">
          <div class="game-board" id="gameBoard" aria-label="카드 게임판"></div>

          <div class="pause-overlay" id="pauseOverlay" hidden>
            <span aria-hidden="true">☕</span>
            <h2>잠시 쉬어갈까요?</h2>
            <p>게임 시간도 멈춰 있어요.</p>
            <button type="button" id="resumeButton">계속하기</button>
          </div>
        </div>

        <div class="game-footer">
          <p><kbd>Space</kbd> 카드 뒤집기 · <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> 이동</p>
          <button class="pause-button" id="pauseButton" type="button">
            <span aria-hidden="true">Ⅱ</span> 일시정지
          </button>
        </div>
      </section>
    </main>

    <footer>
      <span aria-hidden="true">✦</span>
      매일 조금씩, 기억력도 튼튼하게
      <span aria-hidden="true">✦</span>
    </footer>

    <dialog class="result-dialog" id="resultDialog">
      <div class="confetti" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="result-badge" aria-hidden="true">★</div>
      <p class="result-kicker">기억력 훈련 완료!</p>
      <h2>모든 친구를 찾았어요</h2>
      <p class="result-message" id="resultMessage">멋진 기억력이에요!</p>
      <div class="result-stats">
        <div><small>이동 횟수</small><strong id="resultMoves">0회</strong></div>
        <div><small>걸린 시간</small><strong id="resultTime">00:00</strong></div>
        <div><small>최고 콤보</small><strong id="resultCombo">0</strong></div>
      </div>
      <button type="button" id="playAgainButton"><span aria-hidden="true">↻</span> 한 번 더 하기</button>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
